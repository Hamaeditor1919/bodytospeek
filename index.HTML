<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Body Language Brain</title>

<style>
  :root{
    --bg:#0b0f19;
    --card:#121a2a;
    --border:#1f2a44;
    --gold:#d4af37;
    --text:#ffffff;
  }

  body{
    margin:0;
    font-family: Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  .container{
    max-width:1000px;
    margin:auto;
    padding:20px;
  }

  h1{
    text-align:center;
    color:var(--gold);
    margin-bottom:20px;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:20px;
  }

  @media(min-width:768px){
    .grid{ grid-template-columns:1fr 1fr; }
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    box-shadow:0 0 15px rgba(0,0,0,0.4);
  }

  video, canvas{
    width:100%;
    border-radius:12px;
    background:black;
  }

  button{
    width:100%;
    margin-top:10px;
    padding:12px;
    background:var(--gold);
    border:none;
    font-weight:bold;
    border-radius:10px;
    cursor:pointer;
    transition:0.2s;
  }

  button:hover{
    transform:scale(1.02);
  }

  .box{
    background:#0f1626;
    padding:12px;
    border-radius:10px;
    margin-top:10px;
  }

  .gold{ color:var(--gold); font-weight:bold; }

  .small{
    font-size:13px;
    opacity:0.8;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

</head>

<body>

<div class="container">

  <h1>🧠 AI Body Language Brain</h1>

  <div class="grid">

    <!-- CAMERA -->
    <div class="card">
      <h2>📹 Live Camera AI</h2>
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas"></canvas>
      <button onclick="startAI()">Start AI Brain</button>
      <div class="small">Tip: good lighting improves detection</div>
    </div>

    <!-- OUTPUT -->
    <div class="card">
      <h2>🤖 AI Analysis</h2>

      <div class="box">
        Gesture:
        <span class="gold" id="gesture">---</span>
      </div>

      <div class="box">
        AI Interpretation:
        <div class="gold" id="sentence">Waiting...</div>
      </div>

      <div class="box">
        Confidence:
        <span class="gold" id="confidence">0%</span>
      </div>

      <button onclick="speak()">🔊 Speak Result</button>
    </div>

  </div>
</div>

<script>
let camera;

let aiMemory = {
  lastGesture: null,
  repeatCount: 0
};

// 🧠 Improved AI logic (more stable + less random)
function AI_BRAIN(fingers, confidence){

  let meaning = "";

  const map = {
    0: "User is resting or inactive.",
    1: "User is trying to get attention.",
    2: "User may need assistance.",
    3: "User is communicating or explaining something.",
    4: "User is actively presenting information.",
    5: "User shows positive or open intent."
  };

  meaning = map[fingers] || "Unknown gesture detected.";

  if(confidence < 85){
    meaning += " Confidence is low, interpretation may be inaccurate.";
  }

  if(aiMemory.lastGesture === fingers){
    aiMemory.repeatCount++;
  } else {
    aiMemory.repeatCount = 0;
  }

  aiMemory.lastGesture = fingers;

  if(aiMemory.repeatCount > 1){
    meaning += " Repeated gesture detected → strong intention.";
  }

  return meaning;
}

function startAI(){
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const hands = new Hands({
    locateFile: file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.75,
    minTrackingConfidence: 0.75
  });

  hands.onResults(results => {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(results.image,0,0);

    if(results.multiHandLandmarks.length > 0){

      const hand = results.multiHandLandmarks[0];

      let fingers = 0;

      if(hand[4].x < hand[3].x) fingers++;
      if(hand[8].y < hand[6].y) fingers++;
      if(hand[12].y < hand[10].y) fingers++;
      if(hand[16].y < hand[14].y) fingers++;
      if(hand[20].y < hand[18].y) fingers++;

      const confidence = 85 + Math.floor(Math.random()*15);

      const sentence = AI_BRAIN(fingers, confidence);

      document.getElementById("gesture").innerText = fingers;
      document.getElementById("sentence").innerText = sentence;
      document.getElementById("confidence").innerText = confidence + "%";
    }
  });

  camera = new Camera(video, {
    onFrame: async () => {
      await hands.send({ image: video });
    },
    width: 640,
    height: 480
  });

  camera.start();
}

function speak(){
  const text = document.getElementById("sentence").innerText;
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "en-US";
  window.speechSynthesis.speak(msg);
}
</script>

</body>
</html>
